[package]
name = "kosei-cli"
version = "2.0.0"
edition = "2021"
repository = "https://github.com/neiforfaen/kosei-cli"

[[bin]]
name = "kosei"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
similar = "3.1.1"
colored = "3.1.1"

[dev-dependencies]
tempfile = "3.8"
